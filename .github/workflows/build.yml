name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # build.bat locates MSVC via vswhere (-all -prerelease) and runs vcvars64;
      # the windows-latest runner ships Visual Studio with the C++ toolset + Windows SDK.
      - name: Build app (compile + link + manifest)
        shell: cmd
        run: build.bat
      - name: Build and run unit tests
        shell: cmd
        run: build.bat test
      # Everything release.yml builds must also break the PR, not main (review 2026-10-09 M7): the
      # settings host and UI (build.bat config), the signed-variant compile (uiaccess) and the
      # settings UI's Playwright suite. Node comes with the runner image, as in release.yml.
      - name: Install UI dependencies
        shell: cmd
        working-directory: ui
        run: npm ci
      - name: Build settings host and UI (WindConfig.exe, ui/dist)
        shell: cmd
        run: build.bat config
      - name: Build the UIAccess variant
        shell: cmd
        run: build.bat uiaccess
      - name: UI tests (Playwright, headless)
        shell: cmd
        working-directory: ui
        run: npx playwright install chromium && npx playwright test --reporter=line
