name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # build.bat locates MSVC via vswhere (-all -prerelease) and runs vcvars64;
      # the windows-latest runner ships Visual Studio with the C++ toolset + Windows SDK.
      - name: Build app (compile + link + manifest)
        shell: cmd
        run: build.bat
      # Everything release.yml builds must also break the PR, not main (review 2026-10-09 M7, and
      # 2026-10-16: the installer itself). So the PR runs the same shared action release.yml and
      # alpha.yml publish from: the unit tests, the keybind JS test, the Playwright UI suite and tools/release.ps1,
      # which builds the UIAccess variant, the standard build, the settings host and UI, compiles
      # the installer (makensis /WX) and runs tools/installer_check.ps1. The runner is
      # administrator, so the silent install/uninstall round-trip runs too. Nothing is published.
      - name: Build installer (shared with release.yml and alpha.yml)
        uses: ./.github/actions/build-installer
