<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Wind Settings - Tray menu k01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --s:"Segoe UI Variable","Segoe UI",system-ui,sans-serif; --m:"Cascadia Mono",Consolas,monospace; --nf:var(--m);
  --bg:#000; --side:#000; --line:#2a2a2a; --line2:#3a3a3a; --outline:#5c5c5c; --hover:#121212; --card:#121212; --chip:#1a1a1a; --rowline:#222;
  --fg:#f2f2f2; --fg2:#d0d0d0; --fg3:#8f8f8f; --chipb:#3a3a3a; --glyph:#b0b0b0; --cshadow:none; --track:#303030; --accent:#fff; --onaccent:#000;
  --pill:rgba(24,24,24,.9); --pillb:#4a4a4a; --shadow:0 0 0 1px rgba(255,255,255,.05),0 14px 36px rgba(0,0,0,.9);
  --guide:#3c3c3c; --prog:#f2f2f2; --hlStrong:#6e6e6e; --hlDim:#2e2e2e; --hlGrey:#1d1d1d;
  --hl:#2d2d2d; --hlTop:rgba(255,255,255,.32); --hlB:rgba(255,255,255,.07); --hlBot:rgba(0,0,0,.35); --fill:#8a8a8a; --thumb:#e6e6e6;
  --stage:#0b0b0d;
}
:root[data-theme="light"]{
  --bg:#fff; --side:#fff; --line:#e3e3e3; --line2:#d4d4d4; --outline:#9a9a9a; --hover:#f3f3f3; --card:#fff; --chip:#f7f7f7; --rowline:#ececec;
  --fg:#0a0a0a; --fg2:#2e2e2e; --fg3:#6a6a6a; --chipb:#cdcdcd; --glyph:#555; --cshadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.03); --track:#dcdcdc; --accent:#0a0a0a; --onaccent:#fff;
  --pill:rgba(255,255,255,.85); --pillb:#c4c4c4; --shadow:0 10px 28px rgba(0,0,0,.16);
  --guide:#cfcfcf; --prog:#0a0a0a; --hlStrong:#8c8c8c; --hlDim:#dadada; --hlGrey:#ececec;
  --hl:#e2e2e2; --hlTop:rgba(0,0,0,.16); --hlB:rgba(0,0,0,.05); --hlBot:rgba(255,255,255,.9); --fill:#7a7a7a; --thumb:#222;
  --stage:#dcdcdf;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--stage);color:var(--fg);font:13px/1.4 var(--s);-webkit-font-smoothing:antialiased}
body{display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:28px}
svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* ---------- the Settings window ---------- */
.app{width:1120px;height:760px;flex:none;display:grid;grid-template-rows:38px 1fr;border:1px solid var(--line);position:relative;background:var(--bg);overflow:hidden}
.tb{display:flex;align-items:center;border-bottom:1px solid var(--line);padding-left:12px}
.brand{display:flex;align-items:center;gap:10px;font:600 13px var(--s)}
.logo{width:20px;height:20px;border-radius:4px;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.logo svg{width:12px;height:12px;stroke-width:2}
.sp{flex:1}
.wc{width:46px;height:38px;display:grid;place-items:center;color:var(--fg2)}
.wc:hover{background:var(--hover);color:var(--fg)}
.wc svg{width:15px;height:15px;stroke-width:1.75}
.body{display:grid;grid-template-columns:240px 1fr;min-height:0}

.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:12px 10px 14px}
.search{height:32px;border:1px solid var(--line2);display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;color:var(--fg3);margin-bottom:12px;border-radius:var(--srad)}
.search:focus-within{border-color:var(--fg)}
.search .ic{width:16px;height:16px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:13px var(--nf);padding:0}
.search input::placeholder{color:var(--fg3)}
.search kbd{font:10px var(--m);border:1px solid var(--chipb);border-radius:3px;padding:1px 5px;color:var(--fg3)}

nav,.exp{display:flex;flex-direction:column;gap:2px}
.it{position:relative;height:36px;display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--fg3);font:var(--w) 12.5px var(--nf);border-radius:var(--rad);text-transform:var(--case)}
.it .icw{width:20px;display:grid;place-items:center;flex:none}
.it .ic{width:var(--isz);height:var(--isz)}
.it:hover{background:var(--hover);color:var(--fg)}
.it .chev{width:22px;height:22px;margin:0 -6px 0 2px;display:grid;place-items:center;color:var(--fg3);border-radius:var(--rad);flex:none}
.it .chev svg{width:14px;height:14px;stroke-width:1.5;transition:transform .15s ease;transform:rotate(-90deg)}
.it .chev.open svg{transform:none}
.it .chev:hover{color:var(--fg);background:var(--hover)}
.it.sel .chev,.it.on .chev{color:inherit}
.app[data-hl="invert"] .it.sel .chev:hover{background:transparent}
.app[data-counts="off"] .it .chev{margin-left:auto}
.app[data-counts="off"] .it .n:not(.c) + .chev{margin-left:2px}
.side{overflow-y:auto;scrollbar-width:thin}
.it,.sub{user-select:none;cursor:default}
.it .n{margin-left:auto;font:400 10.5px var(--m);color:var(--fg3)}
.it.on,.sub.on{color:var(--fg)}
.app[data-counts="off"] .it .n.c{display:none}

.subs{position:relative;display:flex;flex-direction:column;gap:2px;margin:2px 0 6px 20px}
.subs .rail{position:absolute;left:0;top:-2px;bottom:15px;width:1px;background:var(--guide)}
.subs .prog{position:absolute;left:0;top:-2px;width:1px;height:0;background:var(--prog);transition:height .18s ease}
.app[data-rail="plain"] .subs .prog{display:none}
.sub{position:relative;height:30px;margin-left:24px;display:flex;align-items:center;padding:0 10px;color:var(--fg3);font:var(--w) 12px var(--nf);border-radius:var(--rad);text-transform:var(--case)}
.sub:before{content:"";position:absolute;left:-24px;top:50%;width:16px;height:1px;background:var(--guide)}
.app[data-rail="progress"] .sub.done:before{background:var(--prog)}
.sub:hover{background:var(--hover);color:var(--fg)}

/* highlight styles (applied to .sel) */
.app[data-hl="black"] .sel{background:var(--bg);box-shadow:inset 0 0 0 1px var(--hlStrong);color:var(--fg)}
.app[data-hl="outline"] .sel{background:transparent;box-shadow:inset 0 0 0 1px var(--hlDim);color:var(--fg)}
.app[data-hl="grey"] .sel{background:var(--hlGrey);color:var(--fg)}
.app[data-hl="glow"] .sel{background:var(--hl);box-shadow:inset 0 1px 0 var(--hlTop),inset 0 0 0 1px var(--hlB),inset 0 -2px 3px var(--hlBot);color:var(--fg)}
.app[data-hl="invert"] .sel{background:var(--fg);color:var(--bg)}
.app[data-hl="invert"] .sel .n{color:var(--bg)}
.app[data-hl="text"] .sel{background:none;color:var(--fg)}
.app[data-hl="text"] .sel,.app[data-hl="text"] .on{font-weight:700}
.sel:hover{filter:none}
.app[data-hl="invert"] .sel:hover{background:var(--fg);color:var(--bg)}

.it .ic.px,.search .ic.px,.head .ic.px{width:18px;height:18px}
.themebox button .ic.px{width:9px;height:9px}
.themebox button .ic{width:13px;height:13px}
.glyph{font:600 10.5px/1 var(--m);letter-spacing:-.04em;white-space:nowrap}

.adv{display:flex;flex-direction:column;gap:2px}
.app[data-exp="bottom"] .adv{margin-top:auto;border-top:1px solid var(--line2);padding-top:8px}
.app[data-exp="attached"] .adv{margin-top:14px}
.app[data-exp="attached-rule"] .adv{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.app[data-exp="attached-rule"] .lbl{display:none}
.lbl{font:600 11px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding:2px 10px 8px}
.app[data-exp="bottom"] .themebox{margin-top:8px}
.app:not([data-exp="bottom"]) .themebox{margin-top:auto}

.themebox{display:flex;justify-content:flex-end;gap:2px;padding:0 2px}
.themebox button{height:26px;min-width:30px;padding:0 6px;display:grid;place-items:center;color:var(--fg3);border-radius:var(--rad);font:11px var(--nf);text-transform:var(--case)}
.themebox button .ic{width:15px;height:15px}
.themebox button:hover{color:var(--fg)}
.themebox button.sel{color:var(--fg)}
.app[data-theme-ctl="hidden"] .themebox{visibility:hidden}

/* ---------- page (p04 / m02, unchanged) ---------- */
.main{position:relative;min-height:0;overflow:hidden;padding:0 40px}
.head{display:flex;align-items:center;gap:12px;padding:32px 0 26px}
.head .ic{width:24px;height:24px}
.head .glyph{font-size:16px}
h1{margin:0;font:600 26px/1.1 var(--s);letter-spacing:-.3px}
.cap{margin:34px 0 10px 2px;font:500 13px var(--s);letter-spacing:.02em;color:var(--fg3)}
.head + .cap{margin-top:0}
.card{border:1px solid var(--line);background:var(--card);border-radius:12px;box-shadow:var(--cshadow)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px;min-height:62px;padding:8px 18px}
.ctl{justify-content:flex-end}
.row + .row{border-top:1px solid var(--rowline)}
.k{font:500 13.5px var(--s);color:var(--fg)}
.d{color:var(--fg3);font:12.5px var(--s);margin-top:1px}
.ctl{display:flex;align-items:center;gap:6px}
.kc{height:28px;min-width:44px;justify-content:center;padding:0 10px;border:1px solid var(--chipb);background:var(--chip);border-radius:7px;display:inline-flex;align-items:center;font:12px var(--m);color:var(--fg2)}
.kc.ghost{background:none;color:var(--fg3);gap:5px}
.app[data-addkey="solid"] .kc.ghost{border-color:var(--line2)}
.app[data-addkey="text"] .kc.ghost{border-color:transparent;padding:0 6px}
.app[data-addkey="filled"] .kc.ghost{border-color:transparent;background:var(--chip)}
.kc.ghost:hover{color:var(--fg);border-color:var(--chipb)}
.kc.ghost svg{width:11px;height:11px;stroke-width:1.75}
.pl{font:12px var(--s);color:var(--glyph);min-width:14px;text-align:center}
.track{width:220px;height:3px;border-radius:2px;background:var(--track);position:relative;margin:0 10px 0 0}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--fill)}
.track u{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--thumb);box-shadow:none}
.val{width:46px;margin-left:4px;text-align:right;font:500 13px var(--s);font-variant-numeric:tabular-nums}
/* slider variants */
.app[data-slider="white"] .track i{background:var(--fg)}
.app[data-slider="dim"] .track i{background:var(--outline)}
.app[data-slider="dim"] .track u{background:var(--fg3)}
.app[data-slider="square"] .track{border-radius:0}
.app[data-slider="square"] .track i{background:var(--fg);border-radius:0}
.app[data-slider="square"] .track u{width:10px;height:16px;margin:-8px 0 0 -5px;border-radius:1px;background:var(--fg)}
.app[data-slider="bar"] .track{height:1px;border-radius:0}
.app[data-slider="bar"] .track i{background:var(--fg);border-radius:0}
.app[data-slider="bar"] .track u{width:3px;height:16px;margin:-8px 0 0 -1.5px;border-radius:0;background:var(--fg);box-shadow:none}

.app[data-knob="hollow"] .track u{background:var(--card);box-shadow:inset 0 0 0 2px var(--fill),0 0 0 3px var(--card)}

/* page banner (from round 7's n08) */
.banner{margin:0 -40px;padding:var(--bpad) 40px;display:flex;align-items:center;gap:var(--bgap);position:relative}
.banner h1{font-size:var(--bt);letter-spacing:-.4px}
.bdesc{margin:6px 0 0;color:var(--fg3);font:var(--bd) var(--s)}
.banner + .cap{margin-top:24px}
.size-compact{--bpad:16px;--bgap:12px;--bt:21px;--bd:12.5px;--bb:32px;--bi:16px}
.size-medium{--bpad:28px;--bgap:18px;--bt:28px;--bd:13.5px;--bb:48px;--bi:22px}
.size-tall{--bpad:48px;--bgap:22px;--bt:36px;--bd:14.5px;--bb:64px;--bi:30px}
.look-band{background:var(--band);border-bottom:1px solid var(--line)}
.look-line{border-bottom:1px solid var(--line)}
.look-card{margin:24px 0 0;padding:var(--bpad) 24px;border:1px solid var(--line2);border-radius:12px;background:var(--band)}
.look-teal{background:var(--band);border-bottom:2px solid var(--fill)}
.look-dots{background-color:var(--band);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:10px 10px;border-bottom:1px solid var(--line)}
.look-scan{background-color:var(--band);background-image:repeating-linear-gradient(0deg,var(--dot) 0 1px,transparent 1px 4px);border-bottom:1px solid var(--line)}
.look-invert{background:var(--fg);color:var(--bg)}
.look-invert .bdesc{color:var(--bg);opacity:.65}
.bico{display:grid;place-items:center;flex:none}
.bico .ic{width:var(--bi);height:var(--bi)}
.bico .ic.px{width:calc(var(--bi) + 2px);height:calc(var(--bi) + 2px)}
.bico .glyph{font-size:calc(var(--bi) * .7)}
.bg-none .ic{width:calc(var(--bi) * 1.3);height:calc(var(--bi) * 1.3)}
.bg-square,.bg-rounded,.bg-fill,.bg-circle,.bg-teal,.bg-inverted{width:var(--bb);height:var(--bb)}
.bg-square{border:1px solid var(--line2)}
.bg-rounded{border:1px solid var(--line2);border-radius:10px}
.bg-fill{background:var(--chip)}
.bg-circle{background:var(--chip);border-radius:50%}
.bg-teal{background:color-mix(in srgb,var(--fill) 14%,transparent);color:var(--fill);border:1px solid color-mix(in srgb,var(--fill) 35%,transparent);border-radius:10px}
.bg-inverted{background:var(--fg);color:var(--bg)}
.look-invert .bg-square,.look-invert .bg-rounded{border-color:color-mix(in srgb,var(--bg) 30%,transparent)}
.look-invert .bg-fill,.look-invert .bg-circle{background:color-mix(in srgb,var(--bg) 12%,transparent)}
.look-invert .bg-inverted{background:var(--bg);color:var(--fg)}
.banner.art{background-color:#000;color:#f2f2f2;border-bottom:1px solid #2a2a2a}
.banner.art .bdesc{color:#c4c4c4}
.banner.art .bg-rounded{border-color:rgba(255,255,255,.35);background:rgba(0,0,0,.35)}
.banner.art::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.35) 45%,rgba(0,0,0,0) 75%);pointer-events:none}
.banner > *{position:relative}
.banner.imgbg::before{content:"";position:absolute;inset:0;background:var(--bimg) right center/cover no-repeat;opacity:var(--bop);pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent var(--bfrom),#000 calc(var(--bfrom) + 30%));mask-image:linear-gradient(90deg,transparent var(--bfrom),#000 calc(var(--bfrom) + 30%))}
:root[data-theme="light"] .banner.imgbg::before{filter:invert(1) hue-rotate(180deg)}
.lab .selrow{display:flex;gap:4px}
.lab select{flex:1;min-width:0;background:#0c0c0e;color:#e8e8ea;border:1px solid #303036;border-radius:6px;padding:6px 8px;font:12.5px "Segoe UI Variable","Segoe UI",sans-serif}
.lab select:focus{outline:2px solid #e8e8ea;outline-offset:1px}
.lab .step{width:30px;border:1px solid #303036;border-radius:6px;color:#cfcfd4}
.lab .step:hover{border-color:#55555c}
.lab .kbd-hint{color:#6f6f77;font-size:11px;margin-left:4px}
:root{--band:#0a0a0a;--dot:rgba(255,255,255,.07)}
:root[data-theme="light"]{--band:#f6f6f7;--dot:rgba(0,0,0,.07)}

/* slider styles (colour is locked to teal; only the shape varies) */
.app[data-kshape="small"] .track u{width:8px;height:8px;margin:-4px 0 0 -4px}
.app[data-kshape="ring"] .track u{width:13px;height:13px;margin:-6.5px 0 0 -6.5px;background:var(--card);box-shadow:inset 0 0 0 2px var(--fill)}
.app[data-kshape="square"] .track{border-radius:0}
.app[data-kshape="square"] .track i{border-radius:0}
.app[data-kshape="square"] .track u{width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:0}
.app[data-kshape="bar"] .track{border-radius:0}
.app[data-kshape="bar"] .track i{border-radius:0}
.app[data-kshape="bar"] .track u{width:3px;height:14px;margin:-7px 0 0 -1.5px;border-radius:0}
.app[data-kshape="pill"] .track u{width:18px;height:8px;margin:-4px 0 0 -9px;border-radius:4px}
.app[data-kshape="none"] .track u{display:none}
.app[data-kshape="thick"] .track{height:6px;border-radius:0}
.app[data-kshape="thick"] .track i{border-radius:0}
.app[data-kshape="thick"] .track u{display:none}
.app[data-kshape="thickdot"] .track{height:5px;border-radius:3px}
.app[data-kshape="thickdot"] .track i{border-radius:3px}
.app[data-kshape="thickdot"] .track u{width:15px;height:15px;margin:-7.5px 0 0 -7.5px}
/* round 2 of knob shapes */
.app[data-kshape="ring-thin"] .track u{width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--card);box-shadow:inset 0 0 0 1.25px var(--fill)}
.app[data-kshape="ring-small"] .track u{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--card);box-shadow:inset 0 0 0 1.75px var(--fill)}
.app[data-kshape="target"] .track u{width:14px;height:14px;margin:-7px 0 0 -7px;background:radial-gradient(circle,var(--fill) 0 2.2px,var(--card) 2.6px);box-shadow:inset 0 0 0 1.5px var(--fill)}
.app[data-kshape="tick"] .track u{width:2px;height:18px;margin:-9px 0 0 -1px;border-radius:0}
.app[data-kshape="tick-short"] .track u{width:2px;height:11px;margin:-5.5px 0 0 -1px;border-radius:0}
.app[data-kshape="tick-teal"] .track u{width:2px;height:16px;margin:-8px 0 0 -1px;border-radius:0;background:var(--fg)}
.app[data-kshape="bar"] .track u{width:4px;height:16px;margin:-8px 0 0 -2px;border-radius:1px}
.app[data-kshape="caret"] .track u{width:0;height:0;margin:5px 0 0 -5px;border-radius:0;background:none;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:7px solid var(--fill)}
.app[data-kshape="notch"] .track u{width:0;height:0;margin:-12px 0 0 -5px;border-radius:0;background:none;border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid var(--fill)}
.app[data-kshape="square-o"] .track{border-radius:0} .app[data-kshape="square-o"] .track i{border-radius:0}
.app[data-kshape="square-o"] .track u{width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:0;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--fill)}
.app[data-kshape="diamond"] .track u{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:1px;transform:rotate(45deg)}
.app[data-kshape="capsule"] .track u{width:8px;height:16px;margin:-8px 0 0 -4px;border-radius:4px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--fill)}
.app[data-kshape="bracket"] .track u{width:12px;height:14px;margin:-7px 0 0 -6px;border-radius:0;background:none;border:1.5px solid var(--fill);border-top-width:0;border-bottom-width:0}
.app[data-kshape="cap"] .track u{width:3px;height:9px;margin:-4.5px 0 0 -3px;border-radius:1.5px;background:var(--fg)}
.app[data-kshape="segments"] .track{height:6px;border-radius:0;background:repeating-linear-gradient(90deg,var(--track) 0 9px,transparent 9px 11px)}
.app[data-kshape="segments"] .track i{border-radius:0;background:repeating-linear-gradient(90deg,var(--fill) 0 9px,transparent 9px 11px)}
.app[data-kshape="segments"] .track u{display:none}
.app[data-kshape="glow"] .track u{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;box-shadow:0 0 0 3px color-mix(in srgb,var(--fill) 25%,transparent),0 0 10px color-mix(in srgb,var(--fill) 60%,transparent)}

/* theme switch locations */
.srow{display:flex;gap:6px;margin-bottom:12px}
.srow .search{flex:1;margin-bottom:0;min-width:0}
.tside{width:32px;height:32px;flex:none;border:1px solid var(--line2);display:grid;place-items:center;color:var(--fg3)}
.tside:hover{color:var(--fg);border-color:var(--fg3)}
.tside .ic,.wc .ic{width:14px;height:14px;stroke-width:1.5}
#tbTheme{display:contents}
.hseg{margin-left:auto;display:flex;border:1px solid var(--line2);align-self:center}
.hseg button{width:34px;height:30px;display:grid;place-items:center;color:var(--fg3)}
.hseg button + button{border-left:1px solid var(--line2)}

<body>

<script>
// ---------- icon sets ----------
const T = { // terminal: square caps, mitred joins

  tray:'<path d="M2 4.5l1.5 1.5L6 3.5M8.5 4.5H14M2 11.5l1.5 1.5L6 10.5M8.5 11.5H14"/>',

const M = { // modern (the m02 set)
  zoom:'<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14M5 7h4M7 5v4"/>',
  move:'<path d="M8 2.5v11M2.5 8h11M6.4 4L8 2.5 9.6 4M6.4 12L8 13.5 9.6 12M4 6.4L2.5 8 4 9.6M12 6.4L13.5 8 12 9.6"/>',
  cursor:'<path d="M2.5 1.5l11 5.5-4.7 1.7L7 14z"/>',
  typing:'<path d="M2.5 3.5h4M2.5 12.5h4M4.5 3.5v9M9.5 6h4M9.5 10h4"/>',
  colour:'<circle cx="8" cy="8" r="5.25"/><path d="M8 2.75a5.25 5.25 0 0 1 0 10.5z" fill="currentColor"/>',
  general:'<path d="M2 5h5.5M12.5 5H14M2 11h1.5M8.5 11H14"/><circle cx="10" cy="5" r="2"/><circle cx="6" cy="11" r="2"/>',
  tray:'<path d="M2 4.5l1.5 1.5L6 3.5M8.5 4.5H14M2 11.5l1.5 1.5L6 10.5M8.5 11.5H14"/>',
  adv:'<path d="M5.5 3.5L1.75 8l3.75 4.5M10.5 3.5L14.25 8l-3.75 4.5M9 3l-2 10"/>',
  about:'<circle cx="8" cy="8" r="6"/><path d="M8 7.5V11M8 5v.01"/>',
  search:'<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>',
  auto:'<circle cx="8" cy="8" r="5.25"/><path d="M8 2.75a5.25 5.25 0 0 1 0 10.5z" fill="currentColor"/>',
  light:'<circle cx="8" cy="8" r="2.75"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/>',
  dark:'<path d="M13 9.5A5.5 5.5 0 0 1 6.5 3 5.5 5.5 0 1 0 13 9.5z"/>'
};
const P = { // pixel: 9x9 grids
  zoom:['..xxx....','.x...x...','x..x..x..','x.xxx.x..','x..x..x..','.x...x...','..xxx.x..','.......x.','........x'],
  move:['....x....','...xxx...','....x....','.x..x..x.','xxxxxxxxx','.x..x..x.','....x....','...xxx...','....x....'],
  cursor:['x........','xx.......','x.x......','x..x.....','x...x....','x....x...','x..xxxx..','x.x......','xx.......'],
  typing:['..xx.xx..','....x....','....x....','....x....','....x....','....x....','....x....','....x....','..xx.xx..'],
  colour:['xxxxxxxxx','x...xxxxx','x...xxxxx','x...xxxxx','x...xxxxx','x...xxxxx','x...xxxxx','x...xxxxx','xxxxxxxxx'],
  general:['.........','..xx.....','xxxxxxxxx','..xx.....','.........','......xx.','xxxxxxxxx','......xx.','.........'],
  adv:['.........','x........','.x.......','..x......','.x.......','x........','.........','....xxxxx','.........'],
  about:['xxxxxxxxx','x.......x','x...x...x','x.......x','x...x...x','x...x...x','x...x...x','x.......x','xxxxxxxxx'],
  search:['xxxxxxx..','x.....x..','x.....x..','x.....x..','x.....x..','x.....x..','xxxxxxx..','.......x.','........x'],
  auto:['xxxxxxxxx','x...xxxxx','x...xxxxx','x...xxxxx','x...xxxxx','x...xxxxx','x...xxxxx','x...xxxxx','xxxxxxxxx'],
  light:['xxxxxxxxx','x.......x','x.......x','x.......x','x.......x','x.......x','x.......x','x.......x','xxxxxxxxx'],
  dark:['xxxxxxxxx','xxxxxxxxx','xxxxxxxxx','xxxxxxxxx','xxxxxxxxx','xxxxxxxxx','xxxxxxxxx','xxxxxxxxx','xxxxxxxxx']
};
const A = { zoom:'[+]', move:'<->', cursor:'&gt;', typing:'|_', colour:'##', general:'::', tray:'[v]', adv:'&gt;_', about:'?', search:'/', auto:'A', light:'L', dark:'D' };

function icon(name, set){
  if (set==='none') return '';
  if (set==='ascii') return '<span class="glyph">'+A[name]+'</span>';
  if (set==='pixel'){
    let r=''; P[name].forEach((row,y)=>{ for(let x=0;x<row.length;x++) if(row[x]==='x') r+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'; });
    return '<svg class="ic px" viewBox="0 0 9 9" style="fill:currentColor;stroke:none" shape-rendering="crispEdges">'+r+'</svg>';
  }
  const term = set==='terminal';
  return '<svg class="ic" viewBox="0 0 16 16" style="stroke-width:'+(term?1.5:1.25)+';stroke-linecap:'+(term?'square':'round')+';stroke-linejoin:'+(term?'miter':'round')+'">'+(term?T:M)[name]+'</svg>';
}

// ---------- content ----------
const NAV=[
  {id:'zoom',label:'Zoom',n:6,subs:['Keys','Levels','Speed']},
  {id:'move',label:'Moving around',n:7,subs:['Keys','Pointer']},
  {id:'cursor',label:'Cursor',n:3,subs:[]},
  {id:'typing',label:'Follow typing',n:3,subs:[]},
  {id:'colour',label:'Colour',n:2,subs:[]},
  {id:'general',label:'General',n:6,subs:['Appearance','Profiles','Diagnostics']},
  {id:'tray',label:'Tray menu',n:12,subs:[]},
];
const EXP=[{id:'adv',label:'Advanced',n:15,subs:['Engine','Apps','Fine tuning']},{id:'about',label:'About',n:'0.15.4',ver:true,subs:[]}];
const ALL=NAV.concat(EXP);

// ---------- options ----------
// Max's baseline (2026-10-01). Fixed; only the OPTS below are still open.
const BASE={exp:'bottom',icons:'terminal',isz:'16',font:'cascadia',w:'500',case:'none',hl:'grey',rad:'8',target:'sub',rail:'progress',side:'black',counts:'off',themectl:'icons',addkey:'filled',subs:'off',slider:'grey',hicon:'terminal',head:'large',sfill:'teal',sknob:'teal',strack:'dark',themeloc:'titlebar'};
// Slider colours: [dark theme, light theme].
const FILL={grey:['#8a8a8a','#7a7a7a'],white:['#f2f2f2','#0a0a0a'],silver:['#bdbdbd','#5a5a5a'],dim:['#555555','#b5b5b5'],
  blue:['#4c8dff','#2f6fe0'],sky:['#5ac8fa','#1a9ad6'],cyan:['#22d3ee','#0891b2'],indigo:['#6e7bff','#4553e0'],violet:['#8b7cf6','#6a58e8'],
  purple:['#b37cf6','#8b4fd8'],magenta:['#e45cd8','#b8329f'],pink:['#ff7ab6','#e0457f'],rose:['#f4718a','#d4405f'],red:['#e5484d','#d02f35'],
  orange:['#ff8a3d','#e0661a'],amber:['#e0a43a','#c07f12'],gold:['#d6b25e','#a8842a'],yellow:['#f5d547','#c9a80e'],lime:['#a3e635','#65a30d'],
  green:['#46c46e','#1f9a4a'],phosphor:['#39ff88','#12b85a'],mint:['#5eead4','#14b8a6'],teal:['#2fbfa5','#11977f']};
// Knob: white/grey/same-as-fill/hollow, plus every fill colour.
const KNOB=Object.assign({white:['#e6e6e6','#222222'],grey:['#9a9a9a','#777777'],fill:null,hollow:null},FILL);
const TRACK={dark:['#303030','#dcdcdc'],mid:['#454545','#c4c4c4'],faint:['#1f1f1f','#ececec']};
const sw=c=>'<i class="swatch" style="background:'+c+'"></i>';
// Locked 2026-10-01: banner (band, medium, description, terminal icon in an outlined rounded box), ring slider.
Object.assign(BASE,{banner:'on',blook:'band',bsize:'medium',bdesc:'on',bicon:'terminal',bbg:'rounded',kshape:'ring'});

// ---------- banner backgrounds ----------
// Procedural ones are inline SVG (crisp, tiny); AI images live in banners/*.jpg and are listed in banners/list.js.
const W=840,H=170;
// Every pattern fades out towards the left so the title and description stay clean.
const svgUrl=s=>'url("data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="fg" x1="0" x2="1"><stop offset=".22" stop-color="#fff" stop-opacity="0"/><stop offset=".62" stop-color="#fff" stop-opacity="1"/></linearGradient><mask id="fm"><rect width="100%" height="100%" fill="url(#fg)"/></mask></defs><g mask="url(#fm)">'+s+'</g></svg>')+'")';
let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
// Curved wind lines: every line bends (no near-straight ones), each with its own phase.
function curves(c,n,a1,a2,opts){
  opts=opts||{}; let s='';
  for(let i=0;i<n;i++){
    // Small phase drift keeps the lines flowing together like the original; weave lets them cross.
    const t=i/(n-1), y0=10+t*(H-20), p=i*(opts.weave?0.55:0.12), q=i*(opts.weave?1.3:0.3);
    let d='';
    for(let x=-20;x<=W+20;x+=10){
      let k=1;
      if(opts.pinch){ const u=x/W; k=0.35+u*1.1; }                 // lines spread as they travel right
      let y=y0+(a1*Math.sin(x/170+p)+a2*Math.sin(x/61+q))*k;
      if(opts.pinch) y=H/2+(y-H/2)*(0.45+0.75*(x/W));
      d+=(d?' L':'M')+x+' '+y.toFixed(1);
    }
    s+='<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="'+(opts.w||1)+'"/>';
  }

    '<div class="capsule" role="status"><b>2 unsaved changes</b><button class="btn g">Discard</button><button class="btn p">Save</button></div>';
}

// ---------- Tray menu page: two reorderable lists ----------
const G=p=>'<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">'+p+'</svg>';
// Tray icons: the same terminal line icons as the flyout (i02-solid); the four zoom/speed ones follow its drawing rules.
const TIC={
  warm:G('<path d="M6.5 9.2V3a1.5 1.5 0 0 1 3 0v6.2a3 3 0 1 1-3 0z"/><path d="M8 6v5.5"/>'),
  bright:G('<circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3"/>'),
  maxz:G('<circle cx="6.75" cy="6.75" r="4.75"/><path d="M10.25 10.25L14 14M4.75 6.75h4M6.75 4.75v4"/>'),
  zin:G('<path d="M9.5 2.5h4v4M13.5 2.5L9 7M6.5 13.5h-4v-4M2.5 13.5L7 9M2.5 4.25h3.5M4.25 2.5v3.5"/>'),
  zout:G('<path d="M13.5 6.5h-4v-4M9.5 6.5L14 2M2.5 9.5h4v4M6.5 9.5L2 14M2.5 4.25h3.5"/>'),
  pan:G('<path d="M8 1.5v13M1.5 8h13M6 1.5h4M6 14.5h4M1.5 6v4M14.5 6v4"/>'),
  ftc:G('<path d="M5 2h6M5 14h6M8 2v12"/><path d="M1.5 6v4M14.5 6v4"/>'),
  ffk:G('<path d="M2 5.5V3a1 1 0 0 1 1-1h2.5M10.5 2H13a1 1 0 0 1 1 1v2.5M14 10.5V13a1 1 0 0 1-1 1h-2.5M5.5 14H3a1 1 0 0 1-1-1v-2.5"/><path d="M6 6h4v4H6z"/>'),
  hide:G('<mask id="hideMask"><rect width="16" height="16" fill="#fff"/><path d="M2 2L14 14" stroke="#000" stroke-width="3.6"/></mask><path mask="url(#hideMask)" d="M4 2l8 5.2-3.3.9-1.3 3.8z"/><path d="M2 2L14 14"/>'),
  hires:G('<circle cx="8" cy="8" r="3"/><path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3"/>')
};
const TRAY_ITEMS=[
  ['warm','Warmth','Screen warmth.',1,'sliders'],
  ['bright','Brightness','Screen brightness.',1,'sliders'],
  ['maxz','Max zoom','The highest magnification.',0,'sliders'],
  ['zin','Zoom-in speed','How quickly the view magnifies.',0,'sliders'],
  ['zout','Zoom-out speed','How quickly the view returns.',0,'sliders'],
  ['pan','Pan speed','How fast the view pans.',0,'sliders'],
  ['ftc','Follow the text cursor','Follow the caret while you type.',1,'toggles'],
  ['ffk','Follow keyboard focus','Follow keyboard focus around the screen.',0,'toggles'],
  ['hide','Hide cursor','Hide the pointer while it is not moving.',0,'toggles'],
  ['hires','High resolution cursor','Keep the pointer sharp when magnified.',1,'toggles']
];
const LISTS=[['sliders','Adjustments'],['toggles','Options']];
const TRAY={items:TRAY_ITEMS.map(([id,name,desc,on,grp])=>({id,name,desc,grp,on:!!on}))};
const PERF={on:true,saved:true};
TRAY.saved={order:TRAY.items.map(i=>i.id),on:Object.fromEntries(TRAY.items.map(i=>[i.id,i.on]))};
const GRIP='<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="3" width="2.5" height="2.5"/><rect x="9.5" y="3" width="2.5" height="2.5"/><rect x="4" y="6.75" width="2.5" height="2.5"/><rect x="9.5" y="6.75" width="2.5" height="2.5"/><rect x="4" y="10.5" width="2.5" height="2.5"/><rect x="9.5" y="10.5" width="2.5" height="2.5"/></svg>';
const TICK='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.25 3.25L13 4.5"/></svg>';
function trayBody(){
  const perf='<div class="card"><div class="row"><div><div class="k" id="perfLbl">Performance in the tray</div><div class="d">Zoom, fps and a frame-time graph.</div></div><div class="ctl"><button class="sw" id="perfSwitch" role="switch" aria-checked="'+PERF.on+'" aria-labelledby="perfLbl"><i></i></button></div></div></div>';
  return perf+'<div class="thint">Checked items appear in the tray. Drag to reorder.</div>'+LISTS.map(([g,label])=>'<div class="tcap"><span id="cap-'+g+'">'+label+'</span><span class="cnt" data-cnt="'+g+'"></span></div><div class="card tlist" id="list-'+g+'" data-g="'+g+'" role="list" aria-labelledby="cap-'+g+'">'+
    TRAY.items.filter(i=>i.grp===g).map(i=>
    '<div class="trow" role="listitem" data-id="'+i.id+'"><button class="grip" aria-label="Reorder '+i.name+'. Space to pick up, arrow keys to move, Space to drop." aria-pressed="false">'+GRIP+'</button>'+
    '<span class="tic" title="'+i.name+'">'+TIC[i.id]+'</span>'+
    '<div><div class="k">'+i.name+'</div><div class="d">'+i.desc+'</div></div>'+
    '<button class="chk" role="checkbox" aria-checked="'+i.on+'" aria-label="Show '+i.name+' in the tray">'+TICK+'</button></div>').join('')+'</div>').join('');
}
function trayChanges(){
  let n=TRAY.items.filter(i=>i.on!==TRAY.saved.on[i.id]).length+(PERF.on!==PERF.saved?1:0);
  if(TRAY.items.map(i=>i.id).join()!==TRAY.saved.order.join()) n++;
  return n;
}
function trayCount(){
  document.querySelectorAll('[data-cnt]').forEach(cp=>{ cp.textContent=TRAY.items.filter(i=>i.grp===cp.dataset.cnt&&i.on).length+' on'; });
  const n=trayChanges(), b=document.getElementById('trayCount');
  if(b) b.textContent=n?n+' unsaved change'+(n>1?'s':''):'No unsaved changes';
  const cap=document.querySelector('.capsule'); if(cap){ cap.classList.toggle('off',!n); cap.setAttribute('aria-hidden',n?'false':'true'); cap.querySelectorAll('button').forEach(b=>b.tabIndex=n?0:-1); }
}
function initTray(){
  const sc=document.getElementById('scroller'), live=document.getElementById('trayLive');
  const lists=[...document.querySelectorAll('.tlist')];
  const say=t=>{ live.textContent=''; setTimeout(()=>live.textContent=t,30); };
  const byId=id=>TRAY.items.find(i=>i.id===id);
  const syncItems=()=>{ TRAY.items=lists.flatMap(l=>[...l.querySelectorAll('.trow')].map(r=>byId(r.dataset.id))); trayCount(); };
  trayCount();
  document.getElementById('trayDiscard').onclick=()=>{ const m=Object.fromEntries(TRAY.items.map(i=>[i.id,i])); TRAY.items=TRAY.saved.order.map(id=>m[id]); TRAY.items.forEach(i=>i.on=TRAY.saved.on[i.id]); PERF.on=PERF.saved; renderMain(); };
  document.getElementById('traySave').onclick=()=>{ TRAY.saved={order:TRAY.items.map(i=>i.id),on:Object.fromEntries(TRAY.items.map(i=>[i.id,i.on]))}; PERF.saved=PERF.on; trayCount(); };
  const pt=document.getElementById('perfSwitch');
  pt.onclick=()=>{ PERF.on=!PERF.on; pt.setAttribute('aria-checked',PERF.on); trayCount(); say('Performance in the tray '+(PERF.on?'on':'off')); };
  lists.forEach(initList);

  function initList(list){
  const rows=()=>[...list.querySelectorAll('.trow')];
  let justDragged=false;
  const flip=row=>{ const i=byId(row.dataset.id), b=row.querySelector('.chk');
    i.on=!i.on; b.setAttribute('aria-checked',i.on); trayCount(); say(i.name+(i.on?' shown':' hidden')); };
  list.addEventListener('click',e=>{ if(justDragged||e.target.closest('.grip')) return; const row=e.target.closest('.trow'); if(row) flip(row); });

  // pointer drag
  let d=null;
  const step=()=>{ const r=rows(); return r.length>1?r[1].offsetTop-r[0].offsetTop:62; };
  function layout(){
    const n=rows().length, st=d.step;
    const dy=Math.max(-d.idx*st,Math.min((n-1-d.idx)*st,d.lastY-d.startY+(sc.scrollTop-d.startScroll)));
    d.row.style.transform='translateY('+dy+'px)';
    d.target=Math.max(0,Math.min(n-1,Math.round(d.idx+dy/st)));
    d.rows.forEach((r,j)=>{ if(r===d.row) return;
      let s=0; if(d.idx<d.target&&j>d.idx&&j<=d.target) s=-st; else if(d.target<d.idx&&j>=d.target&&j<d.idx) s=st;
      r.style.transform=s?'translateY('+s+'px)':''; });
  }
  function auto(){
    if(!d||!d.active) return;
    const rc=sc.getBoundingClientRect(), z=56; let v=0;
    if(d.lastY<rc.top+z) v=-Math.ceil((rc.top+z-d.lastY)/4); else if(d.lastY>rc.bottom-z) v=Math.ceil((d.lastY-(rc.bottom-z))/4);
    if(v){ const before=sc.scrollTop; sc.scrollTop+=Math.max(-14,Math.min(14,v)); if(sc.scrollTop!==before) layout(); }
    d.raf=requestAnimationFrame(auto);
  }
  list.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.target.closest('.chk')||d) return;
    const row=e.target.closest('.trow'); if(!row) return;
    const r=rows();
    d={row,rows:r,idx:r.indexOf(row),target:r.indexOf(row),startY:e.clientY,lastY:e.clientY,startScroll:sc.scrollTop,step:step(),active:false,id:e.pointerId};
  });
  list.addEventListener('pointermove',e=>{
    if(!d||e.pointerId!==d.id) return;
    d.lastY=e.clientY;
    if(!d.active){
      if(Math.abs(e.clientY-d.startY)<4) return;
      d.active=true; try{ d.row.setPointerCapture(e.pointerId); }catch(_){}
      d.rows.forEach(r=>{ if(r!==d.row) r.classList.add('shift'); });
      d.row.classList.add('dragging'); d.raf=requestAnimationFrame(auto);
    }
    layout();
  });
  function finish(cancel){
    if(!d) return; const s=d; cancelAnimationFrame(s.raf);
    if(!s.active){ d=null; return; }
    justDragged=true; setTimeout(()=>{justDragged=false;},0);
    if(cancel) s.target=s.idx;
    s.row.classList.add('settling');
    s.row.style.transform='translateY('+((s.target-s.idx)*s.step)+'px)';
    if(cancel) s.rows.forEach(r=>{ if(r!==s.row) r.style.transform=''; });
    let done=false;
    const commit=()=>{
      if(done) return; done=true;
      s.rows.forEach(r=>r.classList.add('noanim'));
      if(s.target!==s.idx){ const ref=s.rows.filter(r=>r!==s.row)[s.target]; ref?list.insertBefore(s.row,ref):list.appendChild(s.row); }
      s.rows.forEach(r=>{ r.style.transform=''; r.classList.remove('dragging','settling','shift'); });
      void list.offsetHeight;
      s.rows.forEach(r=>r.classList.remove('noanim'));
      syncItems(); d=null;
      if(s.target!==s.idx) say(s.row.querySelector('.k').textContent+' moved to position '+(s.target+1)+' of '+s.rows.length);
    };
    s.row.addEventListener('transitionend',ev=>{ if(ev.propertyName==='transform') commit(); },{once:true});
    setTimeout(commit,220);
  }
  list.addEventListener('pointerup',e=>{ if(d&&e.pointerId===d.id) finish(false); });
  list.addEventListener('pointercancel',e=>{ if(d&&e.pointerId===d.id) finish(true); });
  list.addEventListener('lostpointercapture',e=>{ if(d&&d.active&&e.pointerId===d.id&&!d.row.classList.contains('settling')) finish(false); });

  // keyboard: focus the handle, Space picks up, arrows move, Space drops, Escape cancels
  let kb=null, moving=false;
  function flipMove(row,dir){
    const r=rows(), i=r.indexOf(row), j=i+dir; if(j<0||j>=r.length) return false;
    const tops=new Map(r.map(x=>[x,x.offsetTop]));
    moving=true; dir<0?list.insertBefore(row,r[j]):list.insertBefore(row,r[j].nextSibling); row.querySelector('.grip').focus(); moving=false;
    rows().forEach(x=>{ const dy=tops.get(x)-x.offsetTop; if(dy){ x.classList.add('noanim'); x.style.transform='translateY('+dy+'px)'; } });
    void list.offsetHeight;
    rows().forEach(x=>{ if(x.classList.contains('noanim')){ x.classList.remove('noanim'); x.classList.add('shift'); x.style.transform=''; setTimeout(()=>x.classList.remove('shift'),180); } });
    return true;
  }
  const drop=(ok)=>{ if(!kb) return; const row=kb.row, g=row.querySelector('.grip');
    if(!ok){ const cur=rows().indexOf(row); const back=kb.from-cur; for(let n=0;n<Math.abs(back);n++) flipMove(row,Math.sign(back)); }
    row.classList.remove('picked'); g.setAttribute('aria-pressed','false'); syncItems();
    say(ok?row.querySelector('.k').textContent+' dropped at position '+(rows().indexOf(row)+1):'Move cancelled'); kb=null; };
  list.addEventListener('keydown',e=>{
    const g=e.target.closest('.grip'); if(!g) return; const row=g.closest('.trow');
    if(e.key===' '||e.key==='Enter'){ e.preventDefault();
      if(kb) drop(true); else { kb={row,from:rows().indexOf(row)}; row.classList.add('picked'); g.setAttribute('aria-pressed','true'); say(row.querySelector('.k').textContent+' picked up, position '+(kb.from+1)+' of '+rows().length+'. Arrow keys to move.'); }
    } else if(kb&&kb.row===row&&(e.key==='ArrowUp'||e.key==='ArrowDown')){ e.preventDefault();
      if(flipMove(row,e.key==='ArrowUp'?-1:1)){ say('Position '+(rows().indexOf(row)+1)+' of '+rows().length); row.scrollIntoView({block:'nearest'}); }
    } else if(kb&&e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); drop(false); }
  });
  list.addEventListener('focusout',e=>{ if(!moving&&kb&&e.target.closest('.grip')) drop(true); });
  }
}

// ---------- lab controls ----------
(function(){
  const c=document.getElementById('controls');
  let h='';
  OPTS.forEach(([k,l,vals,kind])=>{
    if(kind==='select'){
      h+='<div class="grp"><div class="gl">'+l+' <span class="kbd-hint">click it, then use the arrow keys</span></div><div class="selrow"><button class="step" data-step="-1" aria-label="Previous">&lt;</button><select data-sel="'+k+'" size="1">'+
        vals.map(([v,t],i)=>'<option value="'+v+'">'+(i+1)+'. '+t+'</option>').join('')+'</select><button class="step" data-step="1" aria-label="Next">&gt;</button></div></div>';
      return;
    }
    h+='<div class="grp"><div class="gl">'+l+'</div><div class="seg">'+vals.map(([v,t])=>'<button data-k="'+k+'" data-v="'+v+'">'+t+'</button>').join('')+
      '</div></div>';
  });
  c.innerHTML=h;
  c.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ S[b.dataset.k]=b.dataset.v; apply(); });
  c.querySelectorAll('[data-sel]').forEach(s=>{
    s.value=S[s.dataset.sel];
    s.onchange=s.oninput=()=>{ S[s.dataset.sel]=s.value; apply(); };
    s.parentNode.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ s.selectedIndex=Math.max(0,Math.min(s.options.length-1,s.selectedIndex+(+b.dataset.step))); s.onchange(); s.focus(); });
  });
  document.getElementById('copy').onclick=()=>{ const t=document.getElementById('code'); t.select(); try{ navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand('copy'); } };
})();
apply();
</script>
